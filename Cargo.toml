[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "crates/guinea-trace",
    "crates/guinea-codegen",
    "crates/guinea-core",
    "crates/guinea-app",
    "crates/guinea-ratatui",
    "crates/guinea-router",
    "crates/guinea-winui",
    "crates/guinea-macros",
    "crates/guinea",
]

[workspace.dependencies]
guinea-trace = { path = "crates/guinea-trace" }
guinea-codegen = { path = "crates/guinea-codegen" }
guinea-core = { path = "crates/guinea-core" }
guinea-app = { path = "crates/guinea-app" }
guinea-ratatui = { path = "crates/guinea-ratatui" }
guinea-router = { path = "crates/guinea-router" }
guinea-winui = { path = "crates/guinea-winui" }
guinea-macros = { path = "crates/guinea-macros" }
guinea = { path = "crates/guinea" }
inventory = "0.3"

# --- UI Stack (Windowing) ---
window-vibrancy = "0.7.1"
raw-window-handle = "0.6.2"

# --- UI Stack (windows-reactor) ---
# Pinned to an explicit rev (not just `git = "..."`) so this and
# examples/processes-app's separate workspace/lockfile can't silently drift
# onto different commits of the same crate - they did, until this was added.
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "afb695ebe" }
windows-reactor-setup = { git = "https://github.com/Tam1SH/windows-rs", rev = "afb695ebe" }
windows-canvas = { git = "https://github.com/Tam1SH/windows-rs", rev = "afb695ebe" }

# --- Async ---
tokio = { version = "1.49.0", features = ["full"] }

# --- Serialization & Data ---
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.0", features = ["v4"] }

# --- Logging & Diagnostics ---
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# --- System & Platform ---
windows = { version = "0.61.3", features = [
    "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_UI_Shell",
    "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Performance",
    "Win32_NetworkManagement", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock", "Win32_System_Threading", "UI",
    "UI_ViewManagement", "Win32_System_Hypervisor", "Management", "Management_Deployment",
    "ApplicationModel", "ApplicationModel_Core", "Win32_Storage_Packaging", "Win32_Storage_Packaging_Appx", "Win32_System_Services",
] }

# --- Utilities ---
anyhow = "1.0.100"
arc-swap = "1.7.1"
derive_more = "2.1.1"
toml = "0.9.8"
walkdir = "2.5.0"
strsim = "0.11"
fluent-syntax = "0.12.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
split-debuginfo = "packed"

[profile.dev]
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
debug = 0
