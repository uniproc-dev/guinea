name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels a stale run when new commits land on the same branch/PR - avoids
# burning CI minutes on a build for a diff that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole workspace, including the backend. Windows-only because
  # `guinea-winui` (and `guinea`, which re-exports it) pull in the
  # `windows-reactor` fork and the `windows` crate.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Mandatory, not an optimisation: `windows-reactor` comes from a rev
      # pin on the windows-rs fork, and that repo is large enough that the
      # very first `cargo fetch` takes minutes. rust-cache restores
      # ~/.cargo/git alongside the registry and target dir, so subsequent
      # runs skip the clone entirely.
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  # The half that claims to know nothing about a toolkit, built where no
  # toolkit exists. This job is the claim's only proof: `guinea-core`,
  # `guinea-app` and `guinea-router` have no Windows dependency in their
  # trees, and if one creeps back in, it fails here rather than in a review.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the agnostic crates
        run: >
          cargo test
          -p guinea-core
          -p guinea-app
          -p guinea-router
          -p guinea-macros
          -p guinea-trace
          -p guinea-codegen

      # The facade itself, with the backend feature off - what a port to
      # another toolkit starts from.
      - name: Build the facade without a backend
        run: cargo build -p guinea --no-default-features
