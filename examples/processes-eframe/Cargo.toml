[package]
name = "processes-eframe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The same application as the other three front ends: everything that is not
# drawing comes from `processes-core`, unchanged.
guinea = { path = "../../crates/guinea", default-features = false, features = ["eframe"] }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
processes-core = { path = "../processes-core" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
guinea-plugin-window-state = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
# For `RingSeries` only, which is plain data.
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0", default-features = false }
eframe = "0.36"
egui = "0.36"
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The plugins depend on guinea from git; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../../crates/guinea" }
guinea-core = { path = "../../crates/guinea-core" }

