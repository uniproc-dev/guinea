[package]
name = "processes-tui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The same application as `processes-app`, drawn in a terminal: everything
# that is not drawing comes from `processes-core`, unchanged.
guinea = { path = "../../crates/guinea", default-features = false, features = ["ratatui"] }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-router = { path = "../../crates/guinea-router" }
processes-core = { path = "../processes-core" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.5.0" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.5.0" }
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.5.0", default-features = false }
ratatui = "0.30"
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# `TestApp` only: the feature is gated so an application cannot ship the
# harness by accident, and a dev-dependency is the way to say "tests only".
guinea = { path = "../../crates/guinea", default-features = false, features = ["ratatui", "test-utils"] }

# The plugins depend on guinea from git; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../../crates/guinea" }
guinea-core = { path = "../../crates/guinea-core" }
