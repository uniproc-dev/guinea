[package]
name = "guinea-processes-app-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea", features = ["widgets"] }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", rev = "b59312e" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", rev = "b59312e" }
anyhow = "1.0"
inventory = "0.3"
fluent-templates = "0.14.0"
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
windows-canvas = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }

# The plugin depends on guinea from git; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../../crates/guinea" }
guinea-core = { path = "../../crates/guinea-core" }

[build-dependencies]
windows-reactor-setup = { git = "https://github.com/Tam1SH/windows-rs", rev = "d0fd3ce88" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
