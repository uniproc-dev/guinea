[package]
name = "guinea-processes-app-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
guinea = { path = "../../crates/guinea" }
processes-core = { path = "../processes-core" }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.2.3" }
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.2.3" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.2.3", features = ["winui"] }
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "63450fc98" }
windows-canvas = { git = "https://github.com/Tam1SH/windows-rs", rev = "63450fc98" }

# The plugin depends on guinea from git; without this the example would build
# two copies of guinea and the plugin's `PluginBuilder` would be a different
# type from this application's.
[patch."https://github.com/uniproc-dev/guinea"]
guinea = { path = "../../crates/guinea" }
guinea-core = { path = "../../crates/guinea-core" }

# Temporary: looking at the header separator and the composition chart before
# either is tagged.
[patch."https://github.com/uniproc-dev/guinea-plugins"]
guinea-plugin-store = { path = "../../../guinea-plugins/plugins/store" }
guinea-widgets = { path = "../../../guinea-plugins/widgets" }

[build-dependencies]
guinea-meta-build = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }
windows-reactor-setup = { git = "https://github.com/Tam1SH/windows-rs", rev = "63450fc98" }
guinea-codegen = { path = "../../crates/guinea-codegen" }
