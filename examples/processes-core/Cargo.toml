[package]
name = "processes-core"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, like the front ends that link it: the examples are built
# on their own, against a guinea taken from the parent directory rather than
# from the workspace that develops it.
[workspace]

[dependencies]
# No backend: this crate is the half of the example that does not draw. It
# builds under `--no-default-features` precisely because a terminal front end
# has to link it too.
guinea = { path = "../../crates/guinea", default-features = false }
guinea-core = { path = "../../crates/guinea-core" }
guinea-macros = { path = "../../crates/guinea-macros" }
guinea-plugin-store = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
guinea-plugin-l10n = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
# For `RingSeries` only, which is plain data - the drawing half of the widget
# crate stays behind its `winui` feature and is not pulled in here.
guinea-widgets = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0", default-features = false }
anyhow = "1.0"
inventory = "0.3"
tokio = { version = "1", features = ["time", "rt-multi-thread"] }
tracing = "0.1"

[build-dependencies]
guinea-plugin-l10n-build = { git = "https://github.com/uniproc-dev/guinea-plugins", tag = "v0.4.0" }
