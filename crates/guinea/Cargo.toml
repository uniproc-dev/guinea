[package]
name = "guinea"
version.workspace = true
edition.workspace = true

[dependencies]
guinea-core.workspace = true
guinea-app.workspace = true
guinea-router.workspace = true
guinea-codegen.workspace = true
guinea-meta = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }

# Nothing else: this crate is re-exports. Anything it appears to need is a
# sign that something which belongs in a real crate ended up here.
[target.'cfg(target_os = "windows")'.dependencies]
guinea-winui = { workspace = true, optional = true }

[features]
default = ["winui"]

# The windows-reactor backend. On by default because it is the one that
# exists; off, this crate is the router, the application runtime and the
# macros, which is what a build for another toolkit starts from.
winui = ["dep:guinea-winui"]

# `app::TestApp` - an application without a window, for crates that write
# plugins or features out of tree and need to install them in a test.
test-utils = ["guinea-app/test-utils"]

[lints]
workspace = true

[dev-dependencies]
anyhow.workspace = true
guinea-router.workspace = true
tempfile = "3.27.0"
uuid.workspace = true
guinea-macros.workspace = true
inventory.workspace = true
guinea-core = { workspace = true, features = ["test-utils"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-reactor.workspace = true
