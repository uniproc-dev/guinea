[package]
name = "guinea"
version.workspace = true
edition.workspace = true

[dependencies]
guinea-core.workspace = true
guinea-codegen.workspace = true
guinea-meta = { git = "https://github.com/uniproc-dev/guinea-meta", tag = "v0.1.0" }
tracing.workspace = true
anyhow.workspace = true
derive_more.workspace = true
serde.workspace = true
serde_json.workspace = true
raw-window-handle.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
windows-reactor.workspace = true
windows-canvas = { workspace = true, optional = true }

[features]
# Table/chart widgets (crates/guinea/src/widgets) - opt-in since they pull in
# windows-canvas and windows-reactor's `canvas` feature, which most apps that
# only need routing/actors don't want.
widgets = ["windows-reactor/canvas", "dep:windows-canvas"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
uuid.workspace = true
guinea-macros.workspace = true
inventory.workspace = true
guinea-core = { workspace = true, features = ["test-utils"] }
